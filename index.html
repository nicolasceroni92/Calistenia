<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calistenia Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calistenia">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root {
  --bg: #0a0c10;
  --card: #12151c;
  --border: #232733;
  --text: #e8eaed;
  --muted: #8a8f9c;
  --accent: #2dd4bf;
  --accent2: #ff4d6d;
  --gold: #f0c430;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--text);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 14px; line-height: 1.5; }
#app { max-width: 720px; margin: 0 auto; padding: 14px; padding-bottom: 90px; }
h1,h2,h3 { margin: 0; }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }
.hidden { display: none !important; }

.topbar { display:flex; align-items:center; justify-content:space-between; padding: 6px 2px 14px; }
.topbar .brand { font-size: 13px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

.deload-toggle {
  display:flex; align-items:center; justify-content:space-between; width:100%;
  padding:10px 14px; background:#0e1016; border:1px solid var(--border); border-radius:6px;
  color: var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase;
}
.deload-toggle.active { background: rgba(255,77,109,0.10); border-color: var(--accent2); color: var(--accent2); }
.deload-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; padding:0 2px; font-size:11px; color:var(--muted); }
.deload-meta a { background:none; border:none; color:var(--accent); font-size:11px; text-decoration:underline; cursor:pointer; }
.deload-meta a.muted-link { color: var(--muted); }
.deload-rules { margin-top:8px; padding:12px 14px; background:rgba(255,77,109,0.06); border:1px solid rgba(255,77,109,0.25); border-left:3px solid var(--accent2); border-radius:6px; font-size:12.5px; line-height:1.5; }
.deload-rules b { color: var(--accent2); }

.tabbar { position:fixed; bottom:0; left:0; right:0; display:flex; background:#0d0f15; border-top:1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20; }
.tabbar button { flex:1; background:none; border:none; color:var(--muted); padding:12px 4px 10px; font-size:11px; letter-spacing:.5px; text-transform:uppercase; display:flex; flex-direction:column; align-items:center; gap:3px; }
.tabbar button .ic { font-size:18px; }
.tabbar button.active { color: var(--accent); }

.section-label { display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin: 18px 0 8px; }

.day-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:10px; }
.day-card.today { border-color: var(--accent); }
.day-card .row1 { display:flex; justify-content:space-between; align-items:baseline; }
.day-card .label { font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.day-card .title { font-size:16px; font-weight:700; margin-top:2px; }
.day-card .priority { font-size:12px; color:var(--accent); margin-top:2px; }
.day-card .focus { font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5; }
.day-card .equip { font-size:11px; color:var(--gold); margin-top:8px; }
.day-card .lastlog { font-size:11px; color:var(--muted); margin-top:6px; }

.backbtn { background:none; border:none; color:var(--accent); font-size:13px; padding:4px 0 12px; }

.ex-card, .item-card { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:12px 14px; margin-bottom:8px; }
.ex-card.priority { border-left:2px solid var(--accent); }
.item-card { }
.ex-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.ex-name { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.ex-name .star { color: var(--accent); }
.ex-name .rackbadge { font-size:10px; color: var(--gold); border:1px solid rgba(240,196,48,0.4); padding:1px 5px; border-radius:3px; }
.yt-link { color: var(--muted); text-decoration:none; font-size:12px; border:1px solid var(--border); border-radius:3px; padding:0px 5px; }
.vol { font-family:inherit; font-size:13px; color:var(--text); white-space:nowrap; }
.vol .deload-badge { font-size:11px; font-weight:700; color: var(--accent2); background:rgba(255,77,109,0.10); border:1px solid rgba(255,77,109,0.3); padding:1px 5px; border-radius:3px; margin-left:6px; }
.note { font-size:12px; color:var(--muted); line-height:1.45; margin-top:4px; }
.item-time { font-size:12px; color:var(--muted); font-family:inherit; white-space:nowrap; }

.timerbox { margin-top:10px; background:#0d1016; border:1px solid var(--border); border-radius:6px; padding:10px; }
.timerbox .display { font-size:28px; font-weight:700; text-align:center; letter-spacing:1px; }
.timerbox .sub { text-align:center; font-size:11px; color:var(--muted); margin-top:2px; }
.timerbox .phase { text-align:center; font-size:11px; color:var(--accent); margin-top:4px; min-height:16px; }
.timerbox.prep .display { color:var(--gold); }
.timerbox .controls { display:flex; gap:8px; margin-top:8px; }
.timerbox button { flex:1; background:#171b24; border:1px solid var(--border); color:var(--text); padding:8px; border-radius:5px; font-size:12px; }
.timerbox button.primary { background: var(--accent); color:#04211d; border-color: var(--accent); font-weight:700; }
.timerbox button.rest { background: rgba(240,196,48,0.12); border-color: rgba(240,196,48,0.4); color: var(--gold); }

.sidebyside { display:flex; gap:8px; margin-top:4px; }
.sidebyside .col { flex:1; min-width:0; }
.sidebyside .sidelabel { font-size:10px; color:var(--muted); letter-spacing:1px; margin-bottom:3px; }

.logrow { display:flex; align-items:center; gap:6px; margin-top:10px; flex-wrap:wrap; }
.logrow .setinput { width:52px; background:#0d1016; border:1px solid var(--border); color:var(--text); border-radius:4px; padding:6px 4px; text-align:center; font-size:13px; }
.logrow .setlabel { font-size:10px; color:var(--muted); display:block; text-align:center; margin-bottom:2px; }
.setwrap { display:flex; flex-direction:column; align-items:center; }
.pistol-sets { display:flex; gap:8px; flex-wrap:wrap; width:100%; }
.pistol-set { flex:1 1 72px; min-width:72px; background:#0d1016; border:1px solid var(--border); border-radius:5px; padding:5px; }
.pistol-set .setlabel { margin-bottom:4px; }
.pistol-legs { display:flex; gap:4px; }
.pistol-leg { flex:1; min-width:0; }
.pistol-leg .leglabel { display:block; font-size:9px; color:var(--muted); text-align:center; margin-bottom:2px; }
.pistol-leg .setinput { width:100%; }
.diffrow { display:flex; gap:6px; margin-top:8px; }
.diffrow button { flex:1; padding:6px; border-radius:5px; border:1px solid var(--border); background:#0d1016; color:var(--muted); font-size:12px; }
.diffrow button.sel { border-color: var(--accent); color: var(--accent); background: rgba(45,212,191,0.08); }

.savebar { position:sticky; bottom:56px; margin-top:18px; }
.savebtn { width:100%; padding:13px; background: var(--accent); color:#04211d; font-weight:700; border:none; border-radius:8px; font-size:14px; }
.savebtn:disabled { opacity:0.5; }
.saved-note { text-align:center; font-size:11px; color:var(--muted); margin-top:6px; }

.hist-entry { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
.hist-entry .hhead { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.hist-entry .hdate { font-size:14px; font-weight:700; }
.hist-entry .hday { font-size:11px; color:var(--muted); }
.hist-entry .hbadge { font-size:10px; color:var(--accent2); border:1px solid rgba(255,77,109,0.4); padding:1px 5px; border-radius:3px; margin-left:6px; }
.hist-entry .hdel { background:none; border:none; color:var(--muted); font-size:16px; }
.hist-detail { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; display:none; }
.hist-detail.open { display:block; }
.hist-ex { font-size:12px; margin-bottom:8px; }
.hist-ex .hexname { color:var(--text); font-weight:700; }
.hist-ex .hexvals { color:var(--muted); margin-top:2px; }
.hist-ex .hexdiff { font-size:11px; margin-top:2px; }
.empty-state { text-align:center; color:var(--muted); padding:40px 20px; font-size:13px; line-height:1.6; }

select.exsel { width:100%; padding:10px; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:13px; margin-bottom:14px; }
.chart-stats { display:flex; gap:10px; margin-top:12px; }
.chart-stats .stat { flex:1; background:var(--card); border:1px solid var(--border); border-radius:6px; padding:10px; text-align:center; }
.chart-stats .stat .v { font-size:18px; font-weight:700; color:var(--accent); }
.chart-stats .stat .l { font-size:10px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:1px; }
</style>
</head>

<div id="app"></div>
<script>
const DAYS = [{"id": "lun", "label": "Lunedì", "title": "Trazione prioritaria", "priorityLabel": "Muscle-up · Front Lever", "focus": "Le due skill di trazione più importanti nel giorno più fresco della settimana, dopo 2 giorni di riposo. Muscle-up per primo, a freschezza massima.", "warmup": [{"name": "Trazioni scapolari", "search": "scapular pull up", "note": "Appeso alla sbarra a braccia tese. Sali di pochi cm contraendo solo le scapole (abbassandole), senza piegare i gomiti.", "time": "10 rip."}, {"name": "Apertura elastico (band pull apart)", "search": "band pull apart", "note": "Elastico teso davanti al petto con le braccia stese. Lo apri portando le mani ai lati, contraendo le scapole. Senza elastico: simula il movimento.", "time": "15 rip."}, {"name": "Sospensione passiva alla sbarra", "search": "dead hang", "note": "Appeso alla sbarra a braccia tese, spalle alte (rilassate), corpo morto. Decomprime la colonna.", "time": "30 sec"}], "exercises": [{"name": "Bar muscle-up", "search": "strict bar muscle up", "sets": 5, "reps": 1, "seconds": null, "note": "PRIMA di tutto, a massima freschezza. Test: 3 rip ma ultime 2 sbilanciate sul braccio destro. Soluzione: 5 SINGOLE pulite, recupero 2-3 min tra una e l'altra. Ogni rep fresca = simmetrica. Fermati se senti che diventa storta.", "priority": true, "rack": true}, {"name": "One-leg front lever", "search": "one leg front lever rings", "sets": 4, "reps": null, "seconds": 12, "note": "Test: 15s bilanciato SX/DX, gamba piegata a 90°. Stimolo FL PRINCIPALE. Progressione: apri la gamba piegata verso lo straddle FL. Alterna SX/DX a ogni serie.", "priority": true, "rack": true}, {"name": "Chest-to-bar pull-up esplosivo", "search": "explosive chest to bar pullup", "sets": 4, "reps": 4, "seconds": null, "note": "Potenza di tirata per il muscle-up", "priority": false, "rack": true}, {"name": "Trazioni in false grip", "search": "false grip pullup rings", "sets": 3, "reps": 6, "seconds": null, "note": "Base per muscle-up agli anelli in futuro", "priority": false, "rack": true}, {"name": "Row declinate", "search": "decline row calisthenics", "sets": 3, "reps": 12, "seconds": null, "note": "Piedi a terra, inclinato in tirata finita — variante più leggera, accessorio dopo il lavoro pesante.", "priority": false, "rack": true}], "cooldown": [{"name": "Allungamento dorsali (appeso)", "search": "dead hang lat stretch", "note": "Appeso passivo alla sbarra, spalle rilassate verso l'alto, lasci che i dorsali si allunghino sotto al tuo peso.", "time": "30 sec"}, {"name": "Allungamento bicipite al muro", "search": "bicep stretch wall", "note": "In piedi di fianco a un muro, braccio teso indietro, palmo appoggiato al muro all'altezza della spalla. Ruoti il corpo via dal muro.", "time": "30 sec per lato"}, {"name": "Allungamento polsi", "search": "wrist flexor stretch", "note": "In ginocchio con palmi a terra e dita verso di te. Spingi indietro fino a sentire stiramento sulla parte interna dell'avambraccio.", "time": "30 sec"}, {"name": "Posizione del bambino con braccia tese", "search": "extended child pose", "note": "Posizione del bambino con braccia tese davanti, palmi a terra, spingi le ascelle verso il pavimento.", "time": "1 min"}], "equipment": "Rack necessario per tutta la sessione"}, {"id": "mar", "label": "Martedì", "title": "Core e Compressione", "priorityLabel": "V-sit · Pistol squat", "focus": "Focus unico: compressione attiva. 4 esercizi mirati. High L-sit tornerà quando compression hold sale a 4×15\". Cuscinetto di recupero dopo il lunedì pesante.", "warmup": [{"name": "Rotazioni anche", "search": "hip circles", "note": "In piedi, mani sui fianchi, disegna cerchi ampi con il bacino. Prima in un senso, poi nell'altro.", "time": "30 sec per senso"}, {"name": "Squat profondo tenuto", "search": "deep squat hold", "note": "Scendi in accosciata completa (sedere vicino alle caviglie), schiena dritta, talloni a terra. Resti fermo respirando.", "time": "30 sec"}, {"name": "Pike seduto (allungamento posteriore)", "search": "seated forward fold", "note": "Seduto a terra, gambe tese unite, ti pieghi in avanti cercando di toccare i piedi mantenendo la schiena lunga.", "time": "30 sec"}, {"name": "Pancake (gambe divaricate piegate)", "search": "pancake stretch", "note": "Seduto a terra con gambe divaricate il più possibile, ti pieghi in avanti con il busto cercando di portare il petto a terra.", "time": "45 sec"}], "exercises": [{"name": "Compression hold a terra", "search": "compression hold pike", "sets": 4, "reps": null, "seconds": 10, "note": "Seduto, gambe tese, palmi a terra all'altezza delle ginocchia: spingi giù e solleva le gambe più in alto possibile. Questa posizione chiude di più l'anca e fa lavorare i flessori. Quando diventa facile, sposta le mani verso i fianchi per più sfida.", "priority": true, "rack": false}, {"name": "Leg lift in L-sit (parallette)", "search": "L sit leg lift V sit", "sets": 5, "reps": 5, "seconds": null, "note": "Test: 7 rip max. Fai 5×5 STRICT con gambe tese, qualità prima del numero. Quando tutte e 5 pulite, sali a 5×6. Pausa 2s in alto se vuoi più stimolo V-sit.", "priority": true, "rack": false}, {"name": "Straddle L-sit", "search": "straddle L sit", "sets": 3, "reps": null, "seconds": 12, "note": "Sulle parallette. Qualità della protrazione, non durata massima.", "priority": true, "rack": false}, {"name": "Pistol squat", "search": "pistol squat", "sets": 4, "reps": 5, "seconds": null, "note": "Mantenimento. Recupero 60 sec.", "priority": false, "rack": false}], "cooldown": [{"name": "Pike seduto profondo", "search": "seated forward fold", "note": "Seduto, gambe tese unite, ti pieghi in avanti rilassato. Versione lenta e sostenuta per defaticare.", "time": "1 min"}, {"name": "Pancake profondo", "search": "pancake stretch", "note": "Versione lenta del pancake del warmup, ora rilassi e vai più giù.", "time": "1 min"}, {"name": "Affondo basso (allungamento iliaco)", "search": "low lunge hip flexor", "note": "Affondo profondo con ginocchio posteriore a terra. Spingi il bacino in avanti per sentire stiramento sul davanti della coscia posteriore.", "time": "30 sec per lato"}, {"name": "Allungamento femorale sdraiato", "search": "supine hamstring stretch", "note": "Sdraiato sulla schiena, alzi una gamba tesa e la tiri verso di te con le mani (o un asciugamano dietro al polpaccio).", "time": "30 sec per lato"}, {"name": "Allungamento gluteo (figura 4)", "search": "figure 4 stretch", "note": "Sdraiato sulla schiena, appoggi una caviglia sopra il ginocchio opposto (forma un 4), poi tiri la gamba sotto verso il petto.", "time": "30 sec per lato"}], "equipment": "Solo tappeto"}, {"id": "mer", "label": "Mercoledì", "title": "Spinta statica", "priorityLabel": "Planche · HSPU", "focus": "Le due spinte statiche a fresco, 48h dopo la trazione del lunedì. Tendini in estensione (polso/gomito) isolati dai giorni di trazione.", "warmup": [{"name": "Flessioni scapolari", "search": "scapular push up", "note": "In posizione di plank: braccia tese ferme, muovi solo le scapole avvicinandole e allontanandole (saliscendi del busto di pochi cm). Sveglia le scapole.", "time": "10 rip."}, {"name": "Mobilità polsi", "search": "wrist warm up", "note": "Rotazioni ampie dei polsi + allungamento appoggiando i palmi a terra in quadrupedia, prima dita in avanti poi indietro.", "time": "1 min"}, {"name": "Planche lean leggero", "search": "planche lean", "note": "Posizione plank, sposti il peso in avanti portando le spalle oltre i polsi. Solo al 50% dello sforzo, è pre-attivazione.", "time": "2×5\""}], "exercises": [{"name": "Planche lean", "search": "planche lean", "sets": 4, "reps": null, "seconds": 25, "note": "Test: 35s con polsi a 55cm dal muro (testa che sfiora). Obiettivo NON più tempo ma LEAN: ALLONTANA i polsi dal muro tenendo i capelli che sfiorano = braccia più inclinate = più lean = più difficile. Punta a tenere 25\" aumentando i cm oltre 55.", "priority": true, "rack": false}, {"name": "Tuck planche (parallette)", "search": "tuck planche parallettes", "sets": 3, "reps": null, "seconds": 8, "note": "ANELLO DEBOLE — priorità forma. Test: 8s con schiena bassa. Obiettivo: ALZARE IL BACINO sopra le spalle. Check: ① scapole protratte ② spalle davanti ai polsi ③ bacino alto. Meglio 8s con bacino alto che 10s con schiena bassa.", "priority": true, "rack": false}, {"name": "HSPU complete chest-to-wall", "search": "chest to wall HSPU", "sets": 4, "reps": 3, "seconds": null, "note": "Pezzo FORZA della verticale, a fresco. Test: 2 rip complete. HSPU COMPLETE petto al muro, discesa + risalita. Obiettivo salire a 4×4-5. Quando facili, allontana di poco il petto dal muro.", "priority": true, "rack": false}, {"name": "Pronated grip horizontal row", "search": "pronated horizontal row calisthenics", "sets": 4, "reps": 13, "seconds": null, "note": "Piedi su plyo box, orizzontale in tirata finita — variante più dura. Antagonista planche, bilancia il giorno di spinta.", "priority": false, "rack": true}], "cooldown": [{"name": "Allungamento petto al muro", "search": "wall pec stretch", "note": "In piedi di fianco a un muro, braccio steso indietro appoggiato al muro all'altezza della spalla. Ruoti il corpo verso il lato opposto fino a sentire stiramento sul petto.", "time": "30 sec per lato"}, {"name": "Allungamento polsi", "search": "wrist flexor stretch", "note": "In ginocchio, appoggi i palmi a terra con le dita rivolte verso le ginocchia. Spingi indietro fino a sentire stiramento sulla parte interna dell'avambraccio.", "time": "30 sec"}, {"name": "Allungamento spalla (braccio trasversale)", "search": "cross body shoulder stretch", "note": "In piedi, porti un braccio teso davanti al petto e con l'altro lo tiri verso di te all'altezza del gomito.", "time": "30 sec per lato"}, {"name": "Posizione del bambino", "search": "child pose", "note": "In ginocchio, sedere sui talloni, busto piegato in avanti con le braccia tese davanti a terra. Fronte appoggiata.", "time": "1 min"}], "equipment": "Rack solo per l'ultimo esercizio (row)"}, {"id": "gio", "label": "Giovedì", "title": "Trazione volume", "priorityLabel": "Back Lever · Front Lever 2°", "focus": "Advanced tuck back lever principale + secondo stimolo front lever, 72h dopo il FL del lunedì. Tendine bicipitale riposata dopo il mercoledì di spinta.", "warmup": [{"name": "Trazioni scapolari", "search": "scapular pull up", "note": "Appeso alla sbarra a braccia tese. Sali di pochi cm contraendo solo le scapole (abbassandole).", "time": "10 rip."}, {"name": "German hang (sospensione tedesca) agli anelli", "search": "german hang rings", "note": "Appeso agli anelli, fai un'inversione completa portando le gambe sopra la testa e oltre, fino a stare a testa in giù con le braccia tese dietro. Apre molto le spalle.", "time": "2×20\""}, {"name": "Skin the cat (rotazione completa) agli anelli", "search": "skin the cat", "note": "Dagli anelli, parti appeso normale, alzi le gambe e ruoti tutto il corpo all'indietro passando tra le braccia fino al german hang, poi torni indietro.", "time": "5 rip. lenti"}], "exercises": [{"name": "Advanced tuck back lever", "search": "advanced tuck back lever", "sets": 4, "reps": null, "seconds": 8, "note": "Lavoro principale del giorno — hai superato il tuck base, ora è qui che spingi. Obiettivo: aprire verso il tuck singolo quando 4×8\" è stabile.", "priority": true, "rack": true}, {"name": "One-leg front lever", "search": "one leg front lever rings", "sets": 4, "reps": null, "seconds": 12, "note": "Secondo stimolo FL della settimana, 72h dopo il lunedì. Gamba piegata a 90°, alterna SX/DX. Tienilo pulito: è richiamo, non cedimento.", "priority": true, "rack": true}, {"name": "Skin the cat", "search": "skin the cat rings", "sets": 4, "reps": 3, "seconds": null, "note": "Mobilità e forza spalle per back lever", "priority": false, "rack": true}, {"name": "L-sit pullup", "search": "L sit pullup", "sets": 4, "reps": 5, "seconds": null, "note": "Core attivo per tutta la serie", "priority": f <script>
// ============ Storage helpers ============
const LS_CYCLE = "ct_cycle_start";
const LS_DELOAD_OVERRIDE = "ct_deload_override";
const LS_SESSIONS = "ct_sessions";
const DELOAD_CYCLE_WEEKS = 5;

function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

function getCycleStartDate() {
  let s = lsGet(LS_CYCLE);
  if (!s) { s = new Date().toISOString().slice(0, 10); lsSet(LS_CYCLE, s); }
  return s;
}
function setCycleStartDate(dateStr) { lsSet(LS_CYCLE, dateStr); }
function getWeekInfo() {
  const startStr = getCycleStartDate();
  const start = new Date(startStr + "T00:00:00");
  const now = new Date();
  const diffDays = Math.max(0, Math.floor((now - start) / 86400000));
  const weekNumber = Math.floor(diffDays / 7) + 1;
  const weekInCycle = ((weekNumber - 1) % DELOAD_CYCLE_WEEKS) + 1;
  return { startStr, weekNumber, weekInCycle, cycleLength: DELOAD_CYCLE_WEEKS, isDeloadWeek: weekInCycle === DELOAD_CYCLE_WEEKS };
}
function getDeloadOverride() {
  const v = lsGet(LS_DELOAD_OVERRIDE);
  if (v === "true") return true;
  if (v === "false") return false;
  return null;
}
function setDeloadOverride(v) {
  if (v === null) { try { localStorage.removeItem(LS_DELOAD_OVERRIDE); } catch (e) {} }
  else lsSet(LS_DELOAD_OVERRIDE, v ? "true" : "false");
}
function isDeloadActive() {
  const o = getDeloadOverride();
  return o === null ? getWeekInfo().isDeloadWeek : o;
}
function reduceSeconds(sec) { return Math.max(5, Math.round(sec * 0.7)); }
function reduceSets(sets) { return Math.max(1, Math.round(sets / 2)); }

function getSessions() {
  try { return JSON.parse(lsGet(LS_SESSIONS) || "[]"); } catch (e) { return []; }
}
function saveSessions(list) { lsSet(LS_SESSIONS, JSON.stringify(list)); }
function upsertSession(session) {
  const list = getSessions();
  const idx = list.findIndex(s => s.date === session.date && s.dayId === session.dayId);
  if (idx >= 0) list[idx] = session; else list.push(session);
  saveSessions(list);
}
function deleteSession(date, dayId) {
  saveSessions(getSessions().filter(s => !(s.date === date && s.dayId === dayId)));
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDateIt(dstr) {
  const d = new Date(dstr + "T00:00:00");
  return d.toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" });
}
function slugify(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function exKey(dayId, name) { return dayId + "::" + slugify(name); }

// ============ Time parsing (for warmup/cooldown "time" strings) ============
function parseSimpleTime(t) {
  if (!t) return null;
  let m = t.match(/(\d+)\s*min/);
  if (m) return parseInt(m[1], 10) * 60;
  m = t.match(/(\d+)\s*sec/);
  if (m) return parseInt(m[1], 10);
  m = t.match(/(\d+)["]/);
  if (m) return parseInt(m[1], 10);
  return null;
}

// ============ Audio beep ============
let audioCtx = null;
function beep(freq, dur, vol) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq || 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.value = vol || 0.15;
    o.start(); o.stop(audioCtx.currentTime + (dur || 80) / 1000);
  } catch (e) {}
}

// ============ App state ============
const state = {
  tab: "week",       // week | day | history | charts
  dayId: null,
  showDeloadRules: false,
  historyOpen: {},   // "date::dayId" -> bool
  chartExKey: null
};

const el = document.getElementById("app");

function render() {
  let html = renderTopBar();
  if (state.tab === "week") html += renderWeek();
  else if (state.tab === "day") html += renderDay(state.dayId);
  else if (state.tab === "history") html += renderHistory();
  else if (state.tab === "charts") html += renderCharts();
  html += renderTabbar();
  el.innerHTML = html;
  wireEvents();
}
// ============ Top bar (deload) ============
function renderTopBar() {
  const wi = getWeekInfo();
  const deload = isDeloadActive();
  const override = getDeloadOverride();
  const forced = override !== null && override !== wi.isDeloadWeek;
  return `
  <div class="topbar"><div class="brand">Calistenia Tracker</div></div>
  <button class="deload-toggle ${deload ? "active" : ""}" data-act="toggle-deload">
    <span>${deload ? "● Settimana di scarico attiva" : "○ Settimana di scarico"}</span>
    <span>${deload ? "▣" : "▢"}</span>
  </button>
  <div class="deload-meta">
    <span>Settimana ${wi.weekInCycle}/${wi.cycleLength} del ciclo · totale settimana ${wi.weekNumber}${forced ? " · forzato manualmente" : ""}</span>
    <span>
      ${override !== null ? `<a data-act="deload-auto">torna automatico</a>` : ""}
      <a class="muted-link" data-act="set-cycle-start">imposta inizio ciclo</a>
    </span>
  </div>
  ${deload ? `<div class="deload-rules"><b>Regole di scarico</b><br>Serie dimezzate sugli esercizi a ripetizioni, tenute isometriche ridotte del 30% — già applicato qui sotto. Nessun tentativo massimale né record: fermati con 2-3 ripetizioni di margine. Recuperi pieni. Ogni 5ª settimana è scarico automatico — torni più forte, non più debole.</div>` : ""}
  `;
}

// ============ Week view ============
function weekdayIndexToDayId(jsDay) {
  // JS: 0=Sun..6=Sat. Our days: lun,mar,mer,gio,ven (Mon-Fri)
  const map = { 1: "lun", 2: "mar", 3: "mer", 4: "gio", 5: "ven" };
  return map[jsDay] || null;
}
function renderWeek() {
  const todayId = weekdayIndexToDayId(new Date().getDay());
  const sessions = getSessions();
  let html = `<div class="section-label">📅 Settimana</div>`;
  DAYS.forEach(d => {
    const last = sessions.filter(s => s.dayId === d.id).sort((a, b) => b.date.localeCompare(a.date))[0];
    html += `
    <div class="day-card ${d.id === todayId ? "today" : ""}" data-act="open-day" data-day="${d.id}">
      <div class="row1"><span class="label">${d.label}</span></div>
      <div class="title">${escapeHtml(d.title)}</div>
      <div class="priority">${escapeHtml(d.priorityLabel)}</div>
      <div class="focus">${escapeHtml(d.focus)}</div>
      <div class="equip">🔧 ${escapeHtml(d.equipment)}</div>
      ${last ? `<div class="lastlog">Ultima sessione registrata: ${fmtDateIt(last.date)}</div>` : `<div class="lastlog">Nessuna sessione registrata</div>`}
    </div>`;
  });
  return html;
}

// ============ Day view ============
function volLabel(ex) {
  if (ex.seconds != null) return `${ex.sets}×${ex.seconds}"`;
  return `${ex.sets}×${ex.reps}`;
}
function deloadBadge(ex, deload) {
  if (!deload) return "";
  if (ex.seconds != null) return `<span class="deload-badge">↓ ${reduceSeconds(ex.seconds)}" (-30%)</span>`;
  return `<span class="deload-badge">↓ ${reduceSets(ex.sets)} serie</span>`;
}
function ytLink(search) {
  if (!search) return "";
  return `<a class="yt-link" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(search)}">▶</a>`;
}
function itemTimerHtml(item, idPrefix, idx) {
  const secs = parseSimpleTime(item.time);
  if (!secs) return "";
  const isPerSide = item.time && item.time.includes("per lato");
  if (isPerSide) {
    return `<div class="sidebyside">
      <div class="col"><div class="sidelabel">SX</div>${simpleTimerHtml(idPrefix + "_" + idx + "_sx", secs)}</div>
      <div class="col"><div class="sidelabel">DX</div>${simpleTimerHtml(idPrefix + "_" + idx + "_dx", secs)}</div>
    </div>`;
  }
  return simpleTimerHtml(idPrefix + "_" + idx, secs);
}
function simpleTimerHtml(tid, secs) {
  return `<div class="timerbox" data-timer="${tid}" data-secs="${secs}" data-prep="10">
    <div class="display">${fmtClock(secs)}</div>
    <div class="phase">Pronto: 10s</div>
    <div class="controls">
      <button data-act="timer-start" data-tid="${tid}">▶ Avvia</button>
      <button data-act="timer-reset" data-tid="${tid}">↺</button>
    </div>
  </div>`;
}
function fmtClock(s) {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60), r = s % 60;
  return m > 0 ? `${m}:${String(r).padStart(2, "0")}` : `${r}s`;
}

function renderDay(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return `<p>Giorno non trovato.</p>`;
  const deload = isDeloadActive();
  let html = `<button class="backbtn" data-act="back-week">← Settimana</button>`;
  html += `<h2>${escapeHtml(day.label)} — ${escapeHtml(day.title)}</h2>`;
  html += `<div class="priority" style="margin-top:4px">${escapeHtml(day.priorityLabel)}</div>`;
  html += `<div class="focus" style="margin-top:6px">${escapeHtml(day.focus)}</div>`;
  html += `<div class="equip">🔧 ${escapeHtml(day.equipment)}</div>`;

  html += `<div class="section-label">🔥 Riscaldamento</div>`;
  day.warmup.forEach((it, i) => {
    html += `<div class="item-card">
      <div class="ex-head"><div class="ex-name"><span>${escapeHtml(it.name)}</span>${ytLink(it.search)}</div><span class="item-time">${escapeHtml(it.time || "")}</span></div>
      ${it.note ? `<div class="note">${escapeHtml(it.note)}</div>` : ""}
      ${itemTimerHtml(it, day.id + "_w", i)}
    </div>`;
  });

  html += `<div class="section-label">💪 Esercizi</div>`;
  day.exercises.forEach((ex, i) => {
    const key = exKey(day.id, ex.name);
    const totalSets = deload && ex.seconds == null ? reduceSets(ex.sets) : ex.sets;
    const isPistol = ex.name === "Pistol squat";
    const setTargetLabel = ex.seconds != null
      ? (deload ? reduceSeconds(ex.seconds) : ex.seconds) + '"'
      : (ex.reps + " rip");
    let setsInputs = "";
    const placeholder = ex.seconds != null
      ? (deload ? reduceSeconds(ex.seconds) : ex.seconds)
      : (deload ? "-" : ex.reps);

    if (isPistol) {
      setsInputs += `<div class="pistol-sets">`;
      for (let s = 0; s < totalSets; s++) {
        setsInputs += `<div class="pistol-set">
          <span class="setlabel">S${s + 1}</span>
          <div class="pistol-legs">
            <div class="pistol-leg">
              <span class="leglabel">SX</span>
              <input class="setinput" type="number" inputmode="decimal" placeholder="${placeholder}" data-log="${key}" data-set="${s}" data-leg="sx">
            </div>
            <div class="pistol-leg">
              <span class="leglabel">DX</span>
              <input class="setinput" type="number" inputmode="decimal" placeholder="${placeholder}" data-log="${key}" data-set="${s}" data-leg="dx">
            </div>
          </div>
        </div>`;
      }
      setsInputs += `</div>`;
    } else {
      for (let s = 0; s < totalSets; s++) {
        setsInputs += `<div class="setwrap">
          <span class="setlabel">S${s + 1}</span>
          <input class="setinput" type="number" inputmode="decimal" placeholder="${placeholder}" data-log="${key}" data-set="${s}">
        </div>`;
      }
    }

    html += `<div class="ex-card ${ex.priority ? "priority" : ""}">
      <div class="ex-head">
        <div class="ex-name">${ex.priority ? '<span class="star">★</span>' : ""}<span>${escapeHtml(ex.name)}</span>${ytLink(ex.search)}${ex.rack ? '<span class="rackbadge">🔧 rack</span>' : ""}</div>
        <span class="vol">${volLabel(ex)}${deloadBadge(ex, deload)}</span>
      </div>
      ${ex.note ? `<div class="note">${escapeHtml(ex.note)}</div>` : ""}
      ${simpleTimerHtml(day.id + "_e_" + i, ex.seconds != null ? (deload ? reduceSeconds(ex.seconds) : ex.seconds) : 0)}
      <div class="logrow">${setsInputs}<span style="font-size:11px;color:var(--muted)">${ex.seconds != null ? "sec" : "rip"} · target ${setTargetLabel}${isPistol ? " per gamba" : ""}</span></div>
      <div class="diffrow" data-diffgroup="${key}">
        <button data-act="set-diff" data-key="${key}" data-val="facile">🟢 Facile</button>
        <button data-act="set-diff" data-key="${key}" data-val="giusto">🟡 Giusto</button>
        <button data-act="set-diff" data-key="${key}" data-val="duro">🔴 Duro</button>
      </div>
    </div>`;
  });

  html += `<div class="section-label">🧘 Defaticamento</div>`;
  day.cooldown.forEach((it, i) => {
    html += `<div class="item-card">
      <div class="ex-head"><div class="ex-name"><span>${escapeHtml(it.name)}</span>${ytLink(it.search)}</div><span class="item-time">${escapeHtml(it.time || "")}</span></div>
      ${it.note ? `<div class="note">${escapeHtml(it.note)}</div>` : ""}
      ${itemTimerHtml(it, day.id + "_c", i)}
    </div>`;
  });

  html += `<div class="savebar">
    <button class="savebtn" data-act="save-session" data-day="${day.id}">💾 Salva sessione di oggi</button>
    <div class="saved-note" id="save-note"></div>
  </div>`;
  return html;
}

// ============ Tab bar ============
function renderTabbar() {
  const tabs = [
    { id: "week", ic: "📅", label: "Settimana" },
    { id: "history", ic: "📋", label: "Storico" },
    { id: "charts", ic: "📈", label: "Grafici" }
  ];
  return `<div class="tabbar">${tabs.map(t => `<button class="${state.tab === t.id || (state.tab === "day" && t.id === "week") ? "active" : ""}" data-act="tab" data-tab="${t.id}"><span class="ic">${t.ic}</span>${t.label}</button>`).join("")}</div>`;
}

function escapeHtml(s) {
  if (!s) return "";
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
// ============ History view ============
function renderHistory() {
  const sessions = getSessions().slice().sort((a, b) => b.date.localeCompare(a.date));
  if (sessions.length === 0) {
    return `<div class="section-label">📋 Storico</div><div class="empty-state">Nessuna sessione registrata ancora.<br>Vai su una giornata e premi "Salva sessione" dopo l'allenamento.</div>`;
  }
  let html = `<div class="section-label">📋 Storico</div>`;
  sessions.forEach(s => {
    const day = DAYS.find(d => d.id === s.dayId);
    const openKey = s.date + "::" + s.dayId;
    const open = !!state.historyOpen[openKey];
    html += `<div class="hist-entry">
      <div class="hhead" data-act="toggle-hist" data-key="${openKey}">
        <div><div class="hdate">${fmtDateIt(s.date)}</div><div class="hday">${day ? escapeHtml(day.label + " — " + day.title) : s.dayId}${s.deload ? '<span class="hbadge">SCARICO</span>' : ""}</div></div>
        <button class="hdel" data-act="del-session" data-date="${s.date}" data-day="${s.dayId}">🗑</button>
      </div>
      <div class="hist-detail ${open ? "open" : ""}">
        ${(s.entries || []).map(en => `
          <div class="hist-ex">
            <div class="hexname">${escapeHtml(en.name)}</div>
            <div class="hexvals">Target: ${en.target} · Fatto: ${en.name === "Pistol squat" ? formatPistolHistory(en.values) : (en.values.filter(v => v !== null && v !== "").join(", ") || "—")}</div>
            ${en.difficulty ? `<div class="hexdiff">${en.difficulty === "facile" ? "🟢 Facile" : en.difficulty === "duro" ? "🔴 Duro" : "🟡 Giusto"}</div>` : ""}
          </div>`).join("")}
      </div>
    </div>`;
  });
  return html;
}

function formatPistolHistory(values) {
  const vals = Array.isArray(values) ? values : [];
  const parts = [];
  for (let i = 0; i < vals.length; i += 2) {
    const sx = vals[i], dx = vals[i + 1];
    if ((sx === "" || sx == null) && (dx === "" || dx == null)) continue;
    parts.push(`S${i / 2 + 1}: SX ${sx || "—"} · DX ${dx || "—"}`);
  }
  return parts.join(" | ") || "—";
}

// ============ Charts view ============
function allExerciseOptions() {
  const opts = [];
  DAYS.forEach(d => d.exercises.forEach(ex => opts.push({ key: exKey(d.id, ex.name), label: `${ex.name} (${d.label})`, unit: ex.seconds != null ? "sec" : "rip", target: ex.seconds != null ? ex.seconds : ex.reps })));
  return opts;
}
function renderCharts() {
  const opts = allExerciseOptions();
  if (!state.chartExKey) state.chartExKey = opts[0].key;
  const chosen = opts.find(o => o.key === state.chartExKey) || opts[0];
  const sessions = getSessions().filter(s => (s.entries || []).some(e => e.key === chosen.key)).sort((a, b) => a.date.localeCompare(b.date));
  let html = `<div class="section-label">📈 Grafici</div>`;
  html += `<select class="exsel" data-act="chart-select">${opts.map(o => `<option value="${o.key}" ${o.key === chosen.key ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}</select>`;

  if (sessions.length === 0) {
    html += `<div class="empty-state">Nessun dato ancora per questo esercizio.<br>Registralo in una sessione per vedere il trend.</div>`;
    return html;
  }
  const points = sessions.map(s => {
    const entry = s.entries.find(e => e.key === chosen.key);
    const nums = entry.values.map(v => parseFloat(v)).filter(v => !isNaN(v));
    const avg = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
    return { date: s.date, avg };
  }).filter(p => p.avg !== null);

  html += svgLineChart(points, chosen.target, chosen.unit);

  const last = points[points.length - 1];
  const best = points.reduce((m, p) => Math.max(m, p.avg), -Infinity);
  html += `<div class="chart-stats">
    <div class="stat"><div class="v">${points.length}</div><div class="l">Sessioni</div></div>
    <div class="stat"><div class="v">${last ? round1(last.avg) : "—"}</div><div class="l">Ultimo (${chosen.unit})</div></div>
    <div class="stat"><div class="v">${round1(best)}</div><div class="l">Migliore</div></div>
  </div>`;
  return html;
}
function round1(n) { return Math.round(n * 10) / 10; }

function svgLineChart(points, target, unit) {
  const W = 680, H = 220, padL = 40, padR = 16, padT = 16, padB = 28;
  const vals = points.map(p => p.avg).concat([target || 0]);
  const minV = Math.min(...vals, 0);
  const maxV = Math.max(...vals, target || 0) * 1.15 || 1;
  const x = i => padL + (points.length <= 1 ? 0 : (i / (points.length - 1)) * (W - padL - padR));
  const y = v => H - padB - ((v - minV) / (maxV - minV || 1)) * (H - padT - padB);
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.avg).toFixed(1)}`).join(" ");
  const targetY = target != null ? y(target) : null;

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--card);border:1px solid var(--border);border-radius:8px;">`;
  // gridlines
  for (let g = 0; g <= 3; g++) {
    const gy = padT + (g / 3) * (H - padT - padB);
    svg += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
  }
  if (targetY !== null) {
    svg += `<line x1="${padL}" y1="${targetY.toFixed(1)}" x2="${W - padR}" y2="${targetY.toFixed(1)}" stroke="var(--gold)" stroke-width="1" stroke-dasharray="4,3"/>`;
    svg += `<text x="${W - padR}" y="${(targetY - 4).toFixed(1)}" fill="var(--gold)" font-size="10" text-anchor="end">target ${target}${unit === "sec" ? '"' : ""}</text>`;
  }
  svg += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  points.forEach((p, i) => {
    svg += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.avg).toFixed(1)}" r="3.5" fill="var(--accent)"/>`;
  });
  // x labels: first, mid, last
  const labelIdxs = points.length <= 5 ? points.map((_, i) => i) : [0, Math.floor((points.length - 1) / 2), points.length - 1];
  labelIdxs.forEach(i => {
    const d = new Date(points[i].date + "T00:00:00");
    const lbl = d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" });
    svg += `<text x="${x(i).toFixed(1)}" y="${H - 8}" fill="var(--muted)" font-size="10" text-anchor="middle">${lbl}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

// ============ Timer engine ============
const timers = {};

function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "it-IT";
    u.rate = 1.05;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function announceExerciseSecond(sec) {
  if (sec > 0 && (sec <= 5 || sec % 5 === 0)) speak(sec);
}

function timerToggle(tid) {
  const box = document.querySelector(`[data-timer="${tid}"]`);
  if (!box) return;

  const total = parseInt(box.dataset.secs, 10);
  const prepTotal = parseInt(box.dataset.prep || "10", 10);

  if (!timers[tid]) {
    timers[tid] = {
      remaining: total,
      total,
      prep: prepTotal,
      interval: null,
      running: false,
      phase: "prep"
    };
  }

  const t = timers[tid];

  if (t.running) {
    clearInterval(t.interval);
    t.running = false;
    box.querySelector('[data-act="timer-start"]').textContent = "▶ Avvia";
    return;
  }

  if (t.phase === "done") {
    t.remaining = total;
    t.prep = prepTotal;
    t.phase = "prep";
  }

  t.running = true;
  box.querySelector('[data-act="timer-start"]').textContent = "⏸ Pausa";
  box.classList.toggle("prep", t.phase === "prep");

  if (t.phase === "prep") {
    box.querySelector(".display").textContent = fmtClock(t.prep);
    box.querySelector(".phase").textContent = "Preparati";
    speak("Preparati");
  }

  t.interval = setInterval(() => {
    if (t.phase === "prep") {
      t.prep -= 1;
      box.querySelector(".display").textContent = fmtClock(t.prep);

      if (t.prep <= 3 && t.prep > 0) speak(t.prep);

      if (t.prep <= 0) {
        t.phase = "work";
        box.classList.remove("prep");
        box.querySelector(".display").textContent = fmtClock(t.remaining);
        box.querySelector(".phase").textContent = "Vai";
        speak("Via");
      }
      return;
    }

    t.remaining -= 1;
    box.querySelector(".display").textContent = fmtClock(t.remaining);
    box.querySelector(".phase").textContent = t.remaining > 0 ? "Lavoro" : "Fine";

    // 10, 5, then every second for the final 5 seconds.
    if (t.remaining > 0) announceExerciseSecond(t.remaining);

    if (t.remaining <= 0) {
      speak("Fine");
      clearInterval(t.interval);
      t.running = false;
      t.phase = "done";
      box.querySelector('[data-act="timer-start"]').textContent = "▶ Avvia";
    }
  }, 1000);
}

function timerReset(tid) {
  const box = document.querySelector(`[data-timer="${tid}"]`);
  if (!box) return;

  if (timers[tid]) clearInterval(timers[tid].interval);

  const total = parseInt(box.dataset.secs, 10);
  const prep = parseInt(box.dataset.prep || "10", 10);

  timers[tid] = {
    remaining: total,
    total,
    prep,
    interval: null,
    running: false,
    phase: "prep"
  };

  box.classList.add("prep");
  box.querySelector(".display").textContent = fmtClock(total);
  box.querySelector(".phase").textContent = "Pronto: 10s";
  box.querySelector('[data-act="timer-start"]').textContent = "▶ Avvia";
}

// ============ Difficulty selection state (per exercise key, in-memory until save) ============
const diffState = {};

// ============ Event wiring ============
function wireEvents() {
  el.querySelectorAll('[data-act]').forEach(node => {
    node.addEventListener("click", onAction);
  });
}
function onAction(e) {
  const t = e.currentTarget;
  const act = t.dataset.act;
  if (act === "tab") { state.tab = t.dataset.tab; render(); }
  else if (act === "open-day") { state.dayId = t.dataset.day; state.tab = "day"; render(); }
  else if (act === "back-week") { state.tab = "week"; render(); }
  else if (act === "toggle-deload") {
    const cur = isDeloadActive();
    setDeloadOverride(!cur);
    render();
  }
  else if (act === "deload-auto") { setDeloadOverride(null); render(); }
  else if (act === "set-cycle-start") {
    const input = window.prompt("Data di inizio ciclo (AAAA-MM-GG):", getWeekInfo().startStr);
    if (input && /^\d{4}-\d{2}-\d{2}$/.test(input)) { setCycleStartDate(input); render(); }
  }
  else if (act === "timer-start") { timerToggle(t.dataset.tid); }
  else if (act === "timer-reset") { timerReset(t.dataset.tid); }
  else if (act === "set-diff") {
    const key = t.dataset.key, val = t.dataset.val;
    diffState[key] = diffState[key] === val ? null : val;
    const group = el.querySelector(`[data-diffgroup="${key}"]`);
    group.querySelectorAll("button").forEach(b => b.classList.toggle("sel", b.dataset.val === diffState[key]));
  }
  else if (act === "toggle-hist") {
    state.historyOpen[t.dataset.key] = !state.historyOpen[t.dataset.key];
    render();
  }
  else if (act === "del-session") {
    if (window.confirm("Eliminare questa sessione registrata?")) {
      deleteSession(t.dataset.date, t.dataset.day);
      render();
    }
  }
  else if (act === "save-session") { saveCurrentDay(t.dataset.day); }
}
el.addEventListener("change", e => {
  if (e.target.matches('[data-act="chart-select"]')) {
    state.chartExKey = e.target.value;
    render();
  }
});

function saveCurrentDay(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  const deload = isDeloadActive();
  const entries = day.exercises.map(ex => {
    const key = exKey(dayId, ex.name);
    const inputs = el.querySelectorAll(`input[data-log="${key}"]`);
    const values = Array.from(inputs).map(i => i.value);
    const target = ex.seconds != null
      ? (deload ? reduceSeconds(ex.seconds) : ex.seconds) + '"'
      : (deload ? reduceSets(ex.sets) : ex.sets) + "×" + ex.reps;
    return { key, name: ex.name, target, values, difficulty: diffState[key] || null };
  });
  const hasAny = entries.some(en => en.values.some(v => v !== "" && v !== null));
  if (!hasAny) {
    const note = document.getElementById("save-note");
    if (note) note.textContent = "Inserisci almeno un valore prima di salvare.";
    return;
  }
  const existing = getSessions().find(s => s.date === todayStr() && s.dayId === dayId);
  if (existing && !window.confirm("Hai già registrato una sessione oggi per questo giorno. Sovrascrivere?")) return;
  upsertSession({ date: todayStr(), dayId, deload, entries });
  Object.keys(diffState).forEach(k => { if (k.startsWith(dayId + "::")) delete diffState[k]; });
  const note = document.getElementById("save-note");
  if (note) note.textContent = "✓ Sessione salvata.";
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

</script>
