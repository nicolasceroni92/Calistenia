<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calistenia Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calistenia">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root {
  --bg: #090b0f;
  --card: #12151b;
  --card2: #181c24;
  --inset: #0d1015;
  --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.13);
  --text: #f1f3f6;
  --muted: #8d95a5;
  --faint: #5d6575;
  --accent: #c6f432;
  --accent-ink: #141a00;
  --accent-soft: rgba(198,244,50,0.10);
  --accent2: #ff6b6b;
  --accent2-soft: rgba(255,107,107,0.10);
  --gold: #fbbf24;
  --gold-soft: rgba(251,191,36,0.10);
  --radius: 16px;
  --radius-sm: 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
  background: radial-gradient(900px 420px at 50% -180px, rgba(198,244,50,0.08), transparent 70%) no-repeat, var(--bg);
}
#app { max-width: 680px; margin: 0 auto; padding: 16px 16px calc(110px + env(safe-area-inset-bottom, 0px)); }
h1,h2,h3 { margin: 0; }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }
.hidden { display: none !important; }

/* ---------- Top bar ---------- */
.topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding: 8px 2px 18px; }
.topbar .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; }
.topbar .brand b { color: var(--accent); }
.topbar .subbrand { font-size: 13px; color: var(--muted); margin-top: 4px; }
.topbar .version { flex:none; margin-top:6px; font-size: 11px; font-weight:600; color: var(--faint); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums; }

.deload-toggle {
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
  padding:12px 14px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);
  color: var(--text); font-size:14px; font-weight:650; font-weight:700; text-align:left;
}
.deload-toggle .dt-sub { display:block; font-size:12px; font-weight:400; color:var(--muted); margin-top:1px; }
.switch { flex:none; width:44px; height:26px; border-radius:999px; background:#2a2f3a; position:relative; transition:background .2s; }
.switch::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s; }
.deload-toggle.active { background: var(--accent2-soft); border-color: rgba(255,107,107,0.35); }
.deload-toggle.active .switch { background: var(--accent2); }
.deload-toggle.active .switch::after { transform: translateX(18px); }
.deload-meta { display:flex; align-items:center; justify-content:flex-end; gap:16px; margin-top:8px; padding:0 4px; font-size:12px; }
.deload-meta a { color:var(--accent); font-size:12px; font-weight:600; text-decoration:none; cursor:pointer; }
.deload-meta a.muted-link { color: var(--muted); }
.deload-rules { margin-top:10px; padding:14px; background:var(--accent2-soft); border:1px solid rgba(255,107,107,0.25); border-radius:var(--radius-sm); font-size:13px; line-height:1.55; color:#f3d5d5; }
.deload-rules b { color: var(--accent2); display:block; margin-bottom:4px; }

/* ---------- Tab bar ---------- */
.tabbar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom, 0px)); width:calc(100% - 32px); max-width:420px; display:flex; gap:4px; padding:6px; background:rgba(22,25,32,0.85); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--border-strong); border-radius:22px; box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index: 20; }
.tabbar button { flex:1; background:none; border:none; color:var(--muted); padding:8px 4px; font-size:11px; font-weight:600; border-radius:16px; display:flex; flex-direction:column; align-items:center; gap:3px; transition: background .15s, color .15s; }
.tabbar button svg { width:22px; height:22px; }
.tabbar button.active { color: var(--accent); background: var(--accent-soft); }

/* ---------- Sections ---------- */
.section-label { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin: 28px 2px 12px; }
.section-label::before { content:""; width:4px; height:14px; border-radius:2px; background:var(--accent); }
.section-label .count { margin-left:auto; font-weight:600; letter-spacing:0; color:var(--faint); text-transform:none; }

.chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid var(--border); color:var(--muted); background:var(--inset); }
.chip.equip { border-radius:10px; line-height:1.35; padding:4px 10px; color: var(--gold); border-color: rgba(251,191,36,0.22); background: var(--gold-soft); }
.chip svg { width:13px; height:13px; flex:none; }

/* ---------- Week ---------- */
.day-card { display:flex; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; cursor:pointer; transition: transform .12s, border-color .15s; }
.day-card:active { transform: scale(0.985); }
.day-card.today { border-color: rgba(198,244,50,0.45); box-shadow: 0 0 0 1px rgba(198,244,50,0.12), 0 10px 30px rgba(198,244,50,0.06); }
.day-badge { flex:none; width:48px; height:48px; border-radius:14px; background:var(--card2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; letter-spacing:0.5px; color:var(--muted); }
.day-card.today .day-badge { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.day-card.done:not(.today) .day-badge { color: var(--accent); border-color: rgba(198,244,50,0.3); }
.day-body { flex:1; min-width:0; }
.day-card .row1 { display:flex; align-items:center; gap:8px; }
.day-card .label { font-size:12px; color:var(--muted); font-weight:600; }
.pill { font-size:11px; font-weight:800; padding:1px 8px; border-radius:999px; }
.pill.today { background: var(--accent); color: var(--accent-ink); }
.pill.done { background: var(--accent-soft); color: var(--accent); }
.day-card .title { font-size:18px; font-weight:800; letter-spacing:-0.2px; margin-top:2px; line-height:1.25; }
.day-card .priority, .day-hero .priority { font-size:13px; color:var(--accent); font-weight:600; margin-top:3px; }
.day-card .focus { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.meta-row { display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; margin-top:12px; }
.day-card .lastlog { font-size:12px; color:var(--faint); }
.chev { flex:none; align-self:center; color:var(--faint); font-size:24px; line-height:1; }

/* ---------- Day ---------- */
.backbtn { display:inline-flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:600; padding:7px 14px 7px 10px; border-radius:999px; margin-bottom:14px; }
.day-hero { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
.day-hero .label { font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); }
.day-hero h2 { font-size:25px; font-weight:800; letter-spacing:-0.5px; line-height:1.2; margin-top:4px; }
.day-hero .focus { font-size:14px; color:var(--muted); margin-top:10px; line-height:1.55; }
.day-hero .chip { margin-top:12px; }

.ex-card, .item-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.ex-card.priority { border-color: rgba(198,244,50,0.22); background: linear-gradient(180deg, rgba(198,244,50,0.05), transparent 140px), var(--card); }
.ex-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.ex-name { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:16px; font-weight:700; line-height:1.3; }
.item-card .ex-name { font-size:15px; }
.ex-name .star { color: var(--accent); font-size:14px; }
.ex-name .rackbadge { font-size:11px; font-weight:700; color: var(--gold); background: var(--gold-soft); border:1px solid rgba(251,191,36,0.22); padding:1px 8px; border-radius:999px; }
.yt-link { display:inline-flex; align-items:center; justify-content:center; width:28px; height:20px; border-radius:6px; background:rgba(255,64,64,0.14); color:#ff5a5a; text-decoration:none; font-size:10px; }
.vol { flex:none; font-size:15px; font-weight:800; color:var(--text); background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:4px 10px; white-space:nowrap; font-variant-numeric: tabular-nums; text-align:right; }
.vol .deload-badge { display:block; font-size:11px; font-weight:700; color: var(--accent2); margin-top:1px; }
.note { font-size:13px; color:var(--muted); line-height:1.55; margin-top:8px; }
.item-time { flex:none; font-size:12px; font-weight:600; color:var(--muted); background:var(--inset); border:1px solid var(--border); border-radius:999px; padding:2px 10px; white-space:nowrap; }

/* ---------- Timer ---------- */
.timerbox { margin-top:14px; background:var(--inset); border:1px solid var(--border); border-radius:14px; padding:14px; transition: border-color .2s, background .2s; }
.timerbox .phase { text-align:center; font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); min-height:17px; }
.timerbox .display { font-size:46px; font-weight:800; text-align:center; letter-spacing:-1px; line-height:1.1; font-variant-numeric: tabular-nums; margin-top:2px; }
.timerbox .sub { text-align:center; font-size:12px; color:var(--muted); margin-top:4px; min-height:18px; }
.timerbox.running { border-color: rgba(198,244,50,0.5); background: rgba(198,244,50,0.05); }
.timerbox.running .display, .timerbox.running .phase { color: var(--accent); }
.timerbox.prep, .timerbox.resting { border-color: rgba(251,191,36,0.45); background: var(--gold-soft); }
.timerbox.prep .display, .timerbox.resting .display, .timerbox.prep .phase, .timerbox.resting .phase { color:var(--gold); }
.timerbox .controls { display:flex; gap:8px; margin-top:12px; }
.timerbox button { flex:1; min-height:46px; background:var(--card2); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:12px; font-size:14px; font-weight:700; }
.timerbox button[data-act="timer-start"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.timerbox button[data-act="timer-reset"] { flex:0 0 52px; font-size:18px; color:var(--muted); }
.sidebyside { display:flex; gap:10px; }
.sidebyside .col { flex:1; min-width:0; }
.sidebyside .sidelabel { font-size:11px; font-weight:800; color:var(--muted); letter-spacing:1px; margin-top:14px; text-align:center; }
.sidebyside .timerbox { margin-top:6px; padding:12px 10px; }
.sidebyside .timerbox .display { font-size:32px; }
.sidebyside .timerbox button[data-act="timer-reset"] { flex:0 0 40px; }

/* ---------- Log ---------- */
.logrow { display:flex; align-items:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap; }
.logrow .setinput { width:56px; height:48px; background:var(--inset); border:1px solid var(--border-strong); color:var(--text); border-radius:12px; padding:4px; text-align:center; font-size:17px; font-weight:700; font-variant-numeric: tabular-nums; outline:none; transition:border-color .15s, background .15s; -moz-appearance:textfield; }
.logrow .setinput::-webkit-outer-spin-button, .logrow .setinput::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.logrow .setinput::placeholder { color:var(--faint); font-weight:500; }
.logrow .setinput:focus { border-color: var(--accent); }
.logrow .setinput:not(:placeholder-shown) { background: var(--accent-soft); border-color: rgba(198,244,50,0.4); color: var(--accent); }
.logrow .setlabel { font-size:11px; font-weight:700; color:var(--faint); display:block; text-align:center; margin-bottom:4px; }
.logtarget { width:100%; font-size:12px; color:var(--faint); margin-top:2px; }
.setwrap { display:flex; flex-direction:column; align-items:center; flex:1 1 0; min-width:44px; max-width:64px; }
.setwrap .setinput { width:100%; }
.pistol-sets { display:flex; gap:8px; flex-wrap:wrap; width:100%; }
.pistol-set { flex:1 1 120px; min-width:110px; background:var(--inset); border:1px solid var(--border); border-radius:12px; padding:8px; }
.pistol-set .setlabel { margin-bottom:6px; }
.pistol-legs { display:flex; gap:6px; }
.pistol-leg { flex:1; min-width:0; }
.pistol-leg .leglabel { display:block; font-size:10px; font-weight:700; color:var(--faint); text-align:center; margin-bottom:3px; }
.pistol-leg .setinput { width:100%; height:42px; }

.savebar { position:sticky; bottom:calc(92px + env(safe-area-inset-bottom, 0px)); margin-top:24px; z-index:5; }
.savebtn { width:100%; min-height:50px; padding:12px; background: var(--accent); color:var(--accent-ink); font-weight:800; border:none; border-radius:16px; font-size:16px; box-shadow: 0 10px 30px rgba(198,244,50,0.18), 0 2px 8px rgba(0,0,0,0.4); }
.savebtn:disabled { opacity:0.5; }
.saved-note { text-align:center; font-size:12px; color:var(--muted); margin-top:8px; }

/* ---------- Cloud ---------- */
.cloud-card { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-top:4px; }
.cloud-card .cl-ic { flex:none; width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--card2); color:var(--muted); }
.cloud-card .cl-ic svg { width:20px; height:20px; }
.cloud-card.on .cl-ic { background:var(--accent-soft); color:var(--accent); }
.cloud-card.err .cl-ic { background:var(--accent2-soft); color:var(--accent2); }
.cloud-card .cl-body { flex:1; min-width:0; }
.cloud-card .cl-title { font-size:14px; font-weight:700; }
.cloud-card .cl-sub { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
.cloud-card .cl-actions { display:flex; gap:6px; flex:none; }
.cloud-card button { background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:7px 12px; font-size:13px; font-weight:700; }
.cloud-card button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

/* ---------- History ---------- */
.hist-entry { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; }
.hist-entry .hhead { display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer; }
.hist-entry .hdate { font-size:15px; font-weight:700; }
.hist-entry .hday { font-size:13px; color:var(--muted); margin-top:1px; }
.hist-entry .hbadge { font-size:10px; font-weight:800; color:var(--accent2); background:var(--accent2-soft); padding:1px 7px; border-radius:999px; margin-left:8px; letter-spacing:.5px; }
.hist-entry .hdel { flex:none; width:38px; height:38px; display:flex; align-items:center; justify-content:center; background:var(--inset); border:1px solid var(--border); border-radius:10px; color:var(--muted); }
.hist-entry .hdel svg { width:17px; height:17px; pointer-events:none; }
.hist-detail { margin-top:12px; border-top:1px solid var(--border); padding-top:12px; display:none; }
.hist-detail.open { display:block; }
.hist-ex { font-size:13px; margin-bottom:10px; }
.hist-ex .hexname { color:var(--text); font-weight:700; }
.hist-ex .hexvals { color:var(--muted); margin-top:2px; font-variant-numeric: tabular-nums; }
.empty-state { text-align:center; color:var(--muted); padding:48px 24px; font-size:14px; line-height:1.6; background:var(--card); border:1px dashed var(--border-strong); border-radius:var(--radius); }

/* ---------- Reports ---------- */
.report { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:10px; }
.report.latest { border-color: rgba(198,244,50,0.3); }
.report .rhead { display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer; }
.report .rtitle { font-size:15px; font-weight:700; }
.report .rsub { font-size:12px; color:var(--muted); margin-top:1px; }
.report .rbody { margin-top:12px; border-top:1px solid var(--border); padding-top:4px; font-size:14px; line-height:1.6; overflow-wrap:anywhere; }
.report .rbody h3 { font-size:15px; font-weight:800; margin:14px 0 6px; }
.report .rbody h4 { font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin:16px 0 6px; }
.report .rbody p { margin:8px 0; color:var(--text); }
.report .rbody ul, .report .rbody ol { margin:6px 0; padding-left:20px; }
.report .rbody li { margin:5px 0; }
.report .rbody b { color:var(--text); }
.report .rbody code { font-size:13px; background:var(--inset); padding:1px 5px; border-radius:6px; }
.tabbar button { position:relative; }
.tabbar .dot { position:absolute; top:6px; left:calc(50% + 8px); width:8px; height:8px; border-radius:50%; background:var(--accent2); }

/* ---------- Charts ---------- */
select.exsel { width:100%; padding:12px 14px; background:var(--card); border:1px solid var(--border-strong); color:var(--text); border-radius:12px; font-size:15px; font-weight:600; margin-bottom:14px; }
.chart-stats { display:flex; gap:10px; margin-top:12px; }
.chart-stats .stat { flex:1; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 10px; text-align:center; }
.chart-stats .stat .v { font-size:24px; font-weight:800; color:var(--accent); font-variant-numeric: tabular-nums; }
.chart-stats .stat .l { font-size:11px; color:var(--muted); margin-top:2px; font-weight:600; }

/* ---------- Update banner ---------- */
.update-bar { position:fixed; left:50%; transform:translateX(-50%); width:calc(100% - 32px); max-width:420px; bottom:calc(92px + env(safe-area-inset-bottom, 0px)); z-index:100; display:none; align-items:center; gap:10px; background:var(--card2); border:1px solid rgba(198,244,50,0.4); border-radius:14px; padding:10px 10px 10px 14px; font-size:14px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
.update-bar.show { display:flex; }
.update-bar span { flex:1; }
.update-bar button { background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:8px 14px; font-weight:800; font-size:14px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="update-bar" id="updateBar"><span>Nuova versione disponibile</span><button id="updateBtn">Aggiorna</button></div>
<script>
const DAYS = [{"id": "lun", "label": "Lunedì", "title": "Trazione prioritaria", "priorityLabel": "Muscle-up · Front Lever", "focus": "Le due skill di trazione più importanti nel giorno più fresco della settimana, dopo 2 giorni di riposo. Muscle-up per primo, a freschezza massima.", "warmup": [{"name": "Trazioni scapolari", "search": "scapular pull up", "note": "Appeso alla sbarra a braccia tese. Sali di pochi cm contraendo solo le scapole (abbassandole), senza piegare i gomiti.", "time": "10 rip."}, {"name": "Apertura elastico (band pull apart)", "search": "band pull apart", "note": "Elastico teso davanti al petto con le braccia stese. Lo apri portando le mani ai lati, contraendo le scapole. Senza elastico: simula il movimento.", "time": "15 rip."}, {"name": "Sospensione passiva alla sbarra", "search": "dead hang", "note": "Appeso alla sbarra a braccia tese, spalle alte (rilassate), corpo morto. Decomprime la colonna.", "time": "30 sec"}], "exercises": [{"name": "Bar muscle-up", "search": "strict bar muscle up", "sets": 5, "reps": 1, "seconds": null, "note": "PRIMA di tutto, a massima freschezza. Test: 3 rip ma ultime 2 sbilanciate sul braccio destro. Soluzione: 5 SINGOLE pulite, recupero 2-3 min tra una e l'altra. Ogni rep fresca = simmetrica. Fermati se senti che diventa storta.", "priority": true, "rack": true}, {"name": "One-leg front lever", "search": "one leg front lever rings", "sets": 4, "reps": null, "seconds": 12, "note": "Test: 15s bilanciato SX/DX, gamba piegata a 90°. Stimolo FL PRINCIPALE. Progressione: apri la gamba piegata verso lo straddle FL. Alterna SX/DX a ogni serie.", "priority": true, "rack": true}, {"name": "Chest-to-bar pull-up esplosivo", "search": "explosive chest to bar pullup", "sets": 4, "reps": 4, "seconds": null, "note": "Potenza di tirata per il muscle-up", "priority": false, "rack": true}, {"name": "Trazioni in false grip", "search": "false grip pullup rings", "sets": 3, "reps": 6, "seconds": null, "note": "Base per muscle-up agli a <script>
// Incrementare APP_VERSION a ogni pubblicazione: l'app aperta confronta la sua versione con quella online.
const APP_VERSION = "2.6";

// ============ Storage helpers ============
const LS_CYCLE = "ct_cycle_start";
const LS_DELOAD_OVERRIDE = "ct_deload_override";
const LS_SESSIONS = "ct_sessions";
const DELOAD_CYCLE_WEEKS = 5;

function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

function getCycleStartDate() {
  let s = lsGet(LS_CYCLE);
  if (!s) { s = new Date().toISOString().slice(0, 10); lsSet(LS_CYCLE, s); }
  return s;
}
function setCycleStartDate(dateStr) { lsSet(LS_CYCLE, dateStr); }
function getWeekInfo() {
  const startStr = getCycleStartDate();
  const start = new Date(startStr + "T00:00:00");
  const now = new Date();
  const diffDays = Math.max(0, Math.floor((now - start) / 86400000));
  const weekNumber = Math.floor(diffDays / 7) + 1;
  const weekInCycle = ((weekNumber - 1) % DELOAD_CYCLE_WEEKS) + 1;
  return { startStr, weekNumber, weekInCycle, cycleLength: DELOAD_CYCLE_WEEKS, isDeloadWeek: weekInCycle === DELOAD_CYCLE_WEEKS };
}
function getDeloadOverride() {
  const v = lsGet(LS_DELOAD_OVERRIDE);
  if (v === "true") return true;
  if (v === "false") return false;
  return null;
}
function setDeloadOverride(v) {
  if (v === null) { try { localStorage.removeItem(LS_DELOAD_OVERRIDE); } catch (e) {} }
  else lsSet(LS_DELOAD_OVERRIDE, v ? "true" : "false");
}
function isDeloadActive() {
  const o = getDeloadOverride();
  return o === null ? getWeekInfo().isDeloadWeek : o;
}
function reduceSeconds(sec) { return Math.max(5, Math.round(sec * 0.7)); }
function reduceSets(sets) { return Math.max(1, Math.round(sets / 2)); }

function getSessions() {
  try { return JSON.parse(lsGet(LS_SESSIONS) || "[]"); } catch (e) { return []; }
}
function saveSessions(list) { lsSet(LS_SESSIONS, JSON.stringify(list)); }
function upsertSession(session) {
  const list = getSessions();
  const idx = list.findIndex(s => s.date === session.date && s.dayId === session.dayId);
  if (idx >= 0) list[idx] = session; else list.push(session);
  saveSessions(list);
  enqueueSync("save", session.date, session.dayId);
}
function deleteSession(date, dayId) {
  saveSessions(getSessions().filter(s => !(s.date === date && s.dayId === dayId)));
  enqueueSync("delete", date, dayId);
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDateIt(dstr) {
  const d = new Date(dstr + "T00:00:00");
  return d.toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" });
}
function slugify(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function exKey(dayId, name) { return dayId + "::" + slugify(name); }

// ============ Time parsing (for warmup/cooldown "time" strings) ============
function parseSimpleTime(t) {
  if (!t) return null;
  let m = t.match(/(\d+)\s*min/);
  if (m) return parseInt(m[1], 10) * 60;
  m = t.match(/(\d+)\s*sec/);
  if (m) return parseInt(m[1], 10);
  m = t.match(/(\d+)["]/);
  if (m) return parseInt(m[1], 10);
  return null;
}

// ============ Audio beep ============
let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function beep(freq, dur, vol) {
  try {
    unlockAudio();
    const now = audioCtx.currentTime, d = (dur || 80) / 1000;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq || 880;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.start(now); o.stop(now + d + 0.02);
  } catch (e) {}
}
function tick() { beep(1000, 40, 0.12); }

// ============ App state ============
const state = {
  tab: "week",       // week | day | history | charts | reports
  dayId: null,
  showDeloadRules: false,
  historyOpen: {},   // "date::dayId" -> bool
  reportOpen: {},    // week_start -> bool (l'ultimo report è aperto di default)
  chartExKey: null
};

const el = document.getElementById("app");

function render() {
  let html = renderTopBar();
  if (state.tab === "week") html += renderWeek();
  else if (state.tab === "day") html += renderDay(state.dayId);
  else if (state.tab === "history") html += renderHistory();
  else if (state.tab === "charts") html += renderCharts();
  else if (state.tab === "reports") html += renderReports();
  html += renderTabbar();
  el.innerHTML = html;
  wireEvents();
  prefillDay();
  updateWake();
}

// ============ Schermo sempre acceso (Wake Lock) ============
// Attivo nella vista giorno dopo il primo avvio di un timer; rilasciato quando esci dal giorno.
let wakeLock = null, wakeArmed = false;
async function updateWake() {
  const want = wakeArmed && state.tab === "day" && document.visibilityState === "visible";
  try {
    if (want && !wakeLock && "wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch (e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", updateWake);

// ============ Top bar (deload) ============
function renderTopBar() {
  const wi = getWeekInfo();
  const deload = isDeloadActive();
  const override = getDeloadOverride();
  const forced = override !== null && override !== wi.isDeloadWeek;
  return `
  <div class="topbar">
    <div>
      <div class="brand">Calistenia<b>.</b></div>
      <div class="subbrand">Settimana ${wi.weekInCycle} di ${wi.cycleLength} del ciclo · n° ${wi.weekNumber} totale</div>
    </div>
    <div class="version">v${APP_VERSION}</div>
  </div>
  <button class="deload-toggle ${deload ? "active" : ""}" data-act="toggle-deload">
    <span>${deload ? "Settimana di scarico attiva" : "Settimana di scarico"}<span class="dt-sub">${forced ? "Impostata manualmente" : "Automatica ogni " + wi.cycleLength + "ª settimana del ciclo"}</span></span>

// ============ Week view ============
function weekdayIndexToDayId(jsDay) {
  // JS: 0=Sun..6=Sat. Our days: lun,mar,mer,gio,ven (Mon-Fri)
  const map = { 1: "lun", 2: "mar", 3: "mer", 4: "gio", 5: "ven" };
  return map[jsDay] || null;
}
function renderWeek() {
  const todayId = weekdayIndexToDayId(new Date().getDay());
  const sessions = getSessions();
  const monday = new Date();
  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const mondayStr = monday.toISOString().slice(0, 10);
  let html = `<div class="section-label">Settimana<span class="count">${DAYS.length} giorni</span></div>`;
  DAYS.forEach(d => {
    const last = sessions.filter(s => s.dayId === d.id).sort((a, b) => b.date.localeCompare(a.date))[0];
    const isToday = d.id === todayId;
    const doneThisWeek = !!last && last.date >= mondayStr;
    html += `
    <div class="day-card ${isToday ? "today" : ""} ${doneThisWeek ? "done" : ""}" data-act="open-day" data-day="${d.id}">

function itemTimerHtml(item, idPrefix, idx) {

  if (isPerSide) {

function restSecs(ex) {
  const m = (ex.note || "").match(/recupero\s+(\d+)(?:\s*-\s*\d+)?\s*(min|sec)/i);
  if (m) return parseInt(m[1], 10) * (m[2].toLowerCase() === "min" ? 60 : 1);

}
function simpleTimerHtml(tid, secs, opts) {

function fmtClock(s) {

function escapeHtml(s) {

// ============ History view ============
function renderHistory() {

function formatPistolHistory(values) {
  const vals = Array.isArray(values) ? values : [];
  const parts = [];
  for (let i = 0; i < vals.length; i += 2) {
    const sx = vals[i], dx = vals[i + 1];
    if ((sx === "" || sx == null) && (dx === "" || dx == null)) continue;
    parts.push(`S${i / 2 + 1}: SX ${sx || "—"} · DX ${dx || "—"}`);
  }
  return parts.join(" | ") || "—";
}

// ============ Charts view ============
function allExerciseOptions() {
  const opts = [];
  DAYS.forEach(d => d.exercises.forEach(ex => opts.push({ key: exKey(d.id, ex.name), label: `${ex.name} (${d.label})`, unit: ex.seconds != null ? "sec" : "rip", target: ex.seconds != null ? ex.seconds : ex.reps })));
  return opts;
}
function renderCharts() {
  const opts = allExerciseOptions();
  if (!state.chartExKey) state.chartExKey = opts[0].key;
  const chosen = opts.find(o => o.key === state.chartExKey) || opts[0];
  const sessions = getSessions().filter(s => (s.entries || []).some(e => e.key === chosen.key)).sort((a, b) => a.date.localeCompare(b.date));
  let html = `<div class="section-label">Andamento</div>`;
  html += `<select class="exsel" data-act="chart-select">${opts.map(o => `<option value="${o.key}" ${o.key === chosen.key ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}</select>`;

  if (sessions.length === 0) {
    html += `<div class="empty-state">Nessun dato ancora per questo esercizio.<br>Registralo in una sessione per vedere il trend.</div>`;
    return html;
  }
  const points = sessions.map(s => {
    const entry = s.entries.find(e => e.key === chosen.key);
    const nums = entry.values.map(v => parseFloat(v)).filter(v => !isNaN(v));
    const avg = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
    return { date: s.date, avg };
  }).filter(p => p.avg !== null);

  html += svgLineChart(points, chosen.target, chosen.unit);

  const last = points[points.length - 1];
  const best = points.reduce((m, p) => Math.max(m, p.avg), -Infinity);
  html += `<div class="chart-stats">
    <div class="stat"><div class="v">${points.length}</div><div class="l">Sessioni</div></div>
    <div class="stat"><div class="v">${last ? round1(last.avg) : "—"}</div><div class="l">Ultimo (${chosen.unit})</div></div>
    <div class="stat"><div class="v">${round1(best)}</div><div class="l">Migliore</div></div>
  </div>`;
  return html;
}
function round1(n) { return Math.round(n * 10) / 10; }

function svgLineChart(points, target, unit) {
  const W = 680, H = 300, padL = 40, padR = 40, padT = 30, padB = 44;
  const vals = points.map(p => p.avg).concat([target || 0]);
  const minV = Math.min(...vals, 0);
  const maxV = Math.max(...vals, target || 0) * 1.15 || 1;
  const x = i => padL + (points.length <= 1 ? 0 : (i / (points.length - 1)) * (W - padL - padR));
  const y = v => H - padB - ((v - minV) / (maxV - minV || 1)) * (H - padT - padB);
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.avg).toFixed(1)}`).join(" ");
  const targetY = target != null ? y(target) : null;

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--card);border:1px solid var(--border);border-radius:16px;">`;
  // gridlines
  for (let g = 0; g <= 3; g++) {
    const gy = padT + (g / 3) * (H - padT - padB);
    svg += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
  }
  if (targetY !== null) {
    svg += `<line x1="${padL}" y1="${targetY.toFixed(1)}" x2="${W - padR}" y2="${targetY.toFixed(1)}" stroke="var(--gold)" stroke-width="1" stroke-dasharray="4,3"/>`;
    svg += `<text x="${W - padR}" y="${(targetY - 8).toFixed(1)}" fill="var(--gold)" font-size="20" font-weight="600" text-anchor="end">target ${target}${unit === "sec" ? '"' : ""}</text>`;
  }
  if (points.length > 1) svg += `<path d="${path} L${x(points.length - 1).toFixed(1)},${H - padB} L${x(0).toFixed(1)},${H - padB} Z" fill="var(--accent)" opacity="0.08"/>`;
  svg += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
  points.forEach((p, i) => {
    svg += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.avg).toFixed(1)}" r="6" fill="var(--bg)" stroke="var(--accent)" stroke-width="3"/>`;
  });
  // x labels: first, mid, last
  const labelIdxs = points.length <= 5 ? points.map((_, i) => i) : [0, Math.floor((points.length - 1) / 2), points.length - 1];
  labelIdxs.forEach(i => {
    const d = new Date(points[i].date + "T00:00:00");
    const lbl = d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" });
    svg += `<text x="${x(i).toFixed(1)}" y="${H - 12}" fill="var(--muted)" font-size="20" text-anchor="middle">${lbl}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

// ============ Timer engine ============
const timers = {};

function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "it-IT";
    u.rate = 1.05;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function announceExerciseSecond(sec) {
  if (sec > 0 && (sec <= 5 || sec % 5 === 0)) speak(sec);
}

function timerInit(box) {
  const restOnly = box.dataset.mode === "rest";
  const rest = parseInt(box.dataset.rest || "0", 10);
  const prep = parseInt(box.dataset.prep || "10", 10);
  return {
    secs: parseInt(box.dataset.secs, 10) || 0,
    sets: parseInt(box.dataset.sets || "1", 10),
    rest, prep, restOnly,
    key: box.dataset.key || "",
    day: box.dataset.day || "",
    fill: box.dataset.fill || "",
    set: 0,
    phase: restOnly ? "rest" : "prep",
    left: restOnly ? rest : prep,
    interval: null, running: false, started: false
  };
}

// ---- log inputs helpers (registrazione automatica dei valori previsti)
function logInputs(key) {
  return Array.from(el.querySelectorAll("input[data-log]")).filter(i => i.dataset.log === key);
}
function nextEmptySet(key) {
  const ins = logInputs(key).filter(i => !i.value);
  return ins.length ? parseInt(ins[0].dataset.set, 10) : -1;
}
function setsDoneCount(key) {
  const bySet = {};
  logInputs(key).forEach(i => { bySet[i.dataset.set] = (bySet[i.dataset.set] !== false) && !!i.value; });
  return Object.values(bySet).filter(Boolean).length;
}
function repSubUpdate(box) {
  const sub = box.querySelector(".sub");
  if (sub && box.dataset.mode === "rest" && box.dataset.key) {
    sub.textContent = `Serie fatte ${setsDoneCount(box.dataset.key)}/${box.dataset.sets}`;
  }
}
// Scrive il valore previsto nella serie (se vuota) e registra subito la sessione.
function recordSet(t, setIdx, value) {
  logInputs(t.key).filter(i => i.dataset.set === String(setIdx)).forEach(i => { if (!i.value) i.value = value; });
  if (t.day) saveCurrentDay(t.day, true);
}

function timerBtnLabel(t) {
  if (t.restOnly) return t.started && t.phase !== "done" ? "▶ Riprendi" : "✔ Fatta · recupero";
  if (t.phase === "wait") return `▶ Serie ${t.set + 2}`;
  return t.started && t.phase !== "done" ? "▶ Riprendi" : "▶ Avvia";
}

function timerRenderIdle(box, t) {
  box.classList.remove("prep", "resting", "running");
  box.querySelector(".display").textContent = fmtClock(t.restOnly ? t.rest : t.secs);
  box.querySelector(".phase").textContent = t.restOnly ? "Recupero" : `Pronto: ${t.prep}s`;
  const sub = box.querySelector(".sub");
  if (sub && !t.restOnly && t.key) sub.textContent = `Serie 1/${t.sets} · recupero ${fmtClock(t.rest)}`;
  repSubUpdate(box);
  box.querySelector('[data-act="timer-start"]').textContent = timerBtnLabel(t);
}

function timerRender(box, t) {
  box.classList.toggle("prep", t.phase === "prep");
  box.classList.toggle("resting", t.phase === "rest");
  box.classList.toggle("running", t.phase === "work" && !!t.running);
  box.querySelector(".display").textContent = fmtClock(t.left);
  box.querySelector(".phase").textContent = t.phase === "wait"
    ? `Pronto per la serie ${t.set + 2}`
    : { prep: "Preparati", work: "Lavoro", rest: "Recupero", done: "Fine" }[t.phase];
  const sub = box.querySelector(".sub");
  if (sub && !t.restOnly && t.key) {
    if (t.phase === "done") sub.textContent = "Completato";
    else if (t.phase === "rest" || t.phase === "wait") sub.textContent = `Serie ${t.set + 1}/${t.sets} fatta`;
    else sub.textContent = `Serie ${t.set + 1}/${t.sets}`;
  }
  repSubUpdate(box);
  let label;
  if (t.running && !t.restOnly && t.phase === "rest") label = `⏭ Serie ${t.set + 2}`;
  else if (t.running) label = "⏸ Pausa";
  else label = timerBtnLabel(t);
  box.querySelector('[data-act="timer-start"]').textContent = label;
}

function timerFinish(box, t, msg) {
  clearInterval(t.interval);
  t.running = false;
  t.phase = "done";
  t.left = 0;
  beep(1000, 400, 0.2);
  speak(msg);
}

function timerTick(tid, box, t) {
  if (!box.isConnected) { clearInterval(t.interval); delete timers[tid]; return; }
  t.left -= 1;

  if (t.left > 0) {
    tick();
    if (t.phase === "work") announceExerciseSecond(t.left);
    else if (t.phase === "rest" && t.left <= 3) speak(t.left);
    else if (t.phase === "prep" && t.left <= 3) speak(t.left);
    timerRender(box, t);
    return;
  }

  if (t.phase === "prep") {
    t.phase = "work"; t.left = t.secs;
    beep(1400, 250, 0.2); speak("Via");
  } else if (t.phase === "work") {
    recordSet(t, t.set, t.secs);            // valore previsto registrato di default
    if (t.set + 1 >= t.sets) {
      timerFinish(box, t, "Fine");
    } else if (t.rest > 0) {
      t.phase = "rest"; t.left = t.rest;
      beep(600, 250, 0.2); speak("Recupero");
    } else {
      timerWait(box, t, "Serie fatta");
    }
  } else if (t.phase === "rest") {
    if (t.restOnly) timerFinish(box, t, "Fine recupero");
    else timerWait(box, t, "Recupero finito");   // niente ripartenza automatica
  }
  timerRender(box, t);
}

function timerWait(box, t, msg) {
  clearInterval(t.interval);
  t.running = false;
  t.phase = "wait";
  t.left = t.secs;
  beep(1400, 250, 0.2);
  speak(msg);
}

function timerStartNextSet(tid, box, t) {
  clearInterval(t.interval);
  t.set += 1;
  t.phase = "prep"; t.left = t.prep;
  t.running = true; t.started = true;
  speak("Preparati");
  timerRender(box, t);
  t.interval = setInterval(() => timerTick(tid, box, t), 1000);
}

function timerToggle(tid) {
  const box = document.querySelector(`[data-timer="${tid}"]`);
  if (!box) return;
  unlockAudio();
  wakeArmed = true; updateWake();

  let t = timers[tid];
  if (!t || t.phase === "done") t = timers[tid] = timerInit(box);

  // Timer a secondi: il recupero è solo un riferimento, la serie successiva parte solo dal pulsante.
  if (!t.restOnly && (t.phase === "rest" || t.phase === "wait")) { timerStartNextSet(tid, box, t); return; }

  if (t.running) {
    clearInterval(t.interval);
    t.running = false;
    timerRender(box, t);
    return;
  }

  if (!t.started) {
    t.started = true;
    if (t.restOnly) {
      // Esercizio a ripetizioni: "Fatta" registra il numero previsto nella prima serie vuota.
      const idx = nextEmptySet(t.key);
      if (idx >= 0) recordSet(t, idx, t.fill);
      if (nextEmptySet(t.key) === -1) { timerFinish(box, t, "Serie completate"); timerRender(box, t); return; }
      speak("Recupero");
    } else {
      speak("Preparati");
    }
  }
  t.running = true;
  timerRender(box, t);
  t.interval = setInterval(() => timerTick(tid, box, t), 1000);
}

function timerReset(tid) {
  const box = document.querySelector(`[data-timer="${tid}"]`);
  if (!box) return;
  if (timers[tid]) clearInterval(timers[tid].interval);
  const t = timers[tid] = timerInit(box);
  timerRenderIdle(box, t);
}

function wireEvents() {
  el.querySelectorAll('[data-act]').forEach(node => {

}
function onAction(e) {
  const t = e.currentTarget;
  const act = t.dataset.act;
  if (act === "tab") {
    state.tab = t.dataset.tab;
    if (state.tab === "reports") { markReportsSeen(); fetchReports(); }
    render();
  }
  else if (act === "report-toggle") {
    const w = t.dataset.week;
    const isLatest = getReports()[0]?.week_start === w;
    state.reportOpen[w] = !(state.reportOpen[w] ?? isLatest);
    render();
  }
  else if (act === "open-day") { state.dayId = t.dataset.day; state.tab = "day"; render(); }
  else if (act === "back-week") { state.tab = "week"; render(); }
  else if (act === "toggle-deload") {
    const cur = isDeloadActive();
    setDeloadOverride(!cur);
    render();
  }
  else if (act === "deload-auto") { setDeloadOverride(null); render(); }
  else if (act === "set-cycle-start") {
    const input = window.prompt("Data di inizio ciclo (AAAA-MM-GG):", getWeekInfo().startStr);
    if (input && /^\d{4}-\d{2}-\d{2}$/.test(input)) { setCycleStartDate(input); render(); }
  }
  else if (act === "timer-start") { timerToggle(t.dataset.tid); }
  else if (act === "timer-reset") { timerReset(t.dataset.tid); }
  else if (act === "toggle-hist") {
    state.historyOpen[t.dataset.key] = !state.historyOpen[t.dataset.key];
    render();
  }
  else if (act === "del-session") {
    if (window.confirm("Eliminare questa sessione registrata?")) {
      deleteSession(t.dataset.date, t.dataset.day);
      render();
    }
  }
  else if (act === "save-session") { saveCurrentDay(t.dataset.day); }
  else if (act === "cloud-login") { cloudLogin(); }
  else if (act === "cloud-logout") { cloudLogout(); }
  else if (act === "cloud-sync") { cloudFullSync(); }
}
el.addEventListener("change", e => {

function saveCurrentDay(dayId, silent) {
  const day = DAYS.find(d => d.id === dayId);
  const deload = isDeloadActive();
  const entries = day.exercises.map(ex => {
    const key = exKey(dayId, ex.name);
    const values = logInputs(key).map(i => i.value);
    const target = ex.seconds != null
      ? (deload ? reduceSeconds(ex.seconds) : ex.seconds) + '"'
      : (deload ? reduceSets(ex.sets) : ex.sets) + "×" + ex.reps;
    return { key, name: ex.name, target, values };
  });
  const note = document.getElementById("save-note");
  const hasAny = entries.some(en => en.values.some(v => v !== "" && v !== null));
  if (!hasAny) {
    if (note && !silent) note.textContent = "Inserisci almeno un valore prima di salvare.";
    return;
  }
  upsertSession({ date: todayStr(), dayId, deload, entries });
  if (note) note.textContent = silent
    ? "✓ Sessione registrata con i valori previsti — modifica i campi se diversi."
    : "✓ Sessione salvata.";
}

// Ripristina nella vista giorno i valori già registrati oggi (così l'autosalvataggio non li perde).
function prefillDay() {
  if (state.tab !== "day") return;

function cloudEnabled() { return !!(SUPABASE_URL && SUPABASE_KEY); }
function getSyncQueue() { try { return JSON.parse(lsGet(LS_SYNC_QUEUE) || "[]"); } catch (e) { return []; } }

function enqueueSync(op, date, dayId) {

function weekInfoFor(dateStr) {
  const start = new Date(getCycleStartDate() + "T00:00:00");
  const diffDays = Math.max(0, Math.floor((new Date(dateStr + "T00:00:00") - start) / 86400000));
  const weekNumber = Math.floor(diffDays / 7) + 1;
  return { weekNumber, weekInCycle: ((weekNumber - 1) % DELOAD_CYCLE_WEEKS) + 1 };
}

function exerciseByKey(dayId, key) {
  const day = DAYS.find(d => d.id === dayId);
  return day ? day.exercises.find(ex => exKey(dayId, ex.name) === key) : null;
}

// Sessione locale -> payload per save_session (una voce per ogni serie compilata)
function sessionToPayload(sess) {
  const wi = weekInfoFor(sess.date);
  return {
    date: sess.date, dayId: sess.dayId, deload: !!sess.deload,
    weekNumber: wi.weekNumber, weekInCycle: wi.weekInCycle,
    entries: (sess.entries || []).map(en => {
      const ex = exerciseByKey(sess.dayId, en.key);
      const isPistol = en.name === "Pistol squat";
      const sets = [];
      (en.values || []).forEach((v, i) => {
        const n = parseFloat(v);
        if (isNaN(n)) return;
        sets.push(isPistol
          ? { set: Math.floor(i / 2) + 1, leg: i % 2 === 0 ? "sx" : "dx", value: n }
          : { set: i + 1, leg: null, value: n });
      });
      return { key: en.key, name: en.name, target: en.target, unit: ex && ex.seconds != null ? "sec" : "rip", sets };
    })
  };
}

// Righe Supabase -> sessione locale (stesso formato di saveCurrentDay)
function remoteToSession(row) {
  const day = DAYS.find(d => d.id === row.day_id);
  const exercises = day ? day.exercises : [];
  return {
    date: row.date, dayId: row.day_id, deload: row.deload,
    entries: exercises.map(ex => {
      const key = exKey(row.day_id, ex.name);
      const logs = (row.set_logs || []).filter(l => l.exercise_key === key);
      const isPistol = ex.name === "Pistol squat";
      const values = [];
      logs.forEach(l => {
        const idx = isPistol ? (l.set_number - 1) * 2 + (l.leg === "dx" ? 1 : 0) : l.set_number - 1;
        values[idx] = String(Number(l.value));
      });
      for (let i = 0; i < values.length; i++) if (values[i] === undefined) values[i] = "";
      return { key, name: ex.name, target: logs[0] ? logs[0].target : "", values };
    })
  };
}

function loadSupabaseLib() {
  return new Promise((resolve, reject) => {
    if (window.supabase) return resolve(window.supabase);
    const sc = document.createElement("script");
    sc.src = SUPABASE_LIB;
    sc.onload = () => resolve(window.supabase);

  });
}

async function initCloud() {
  if (!cloudEnabled()) return;

    const lib = await loadSupabaseLib();

    cloud.client.auth.onAuthStateChange((event, session) => {
      const wasOut = !cloud.user;
      cloud.user = session ? session.user : null;
      if (cloud.user && wasOut) cloudFullSync();
      refreshCloudCard();
    });

    if (cloud.user) cloudFullSync();

async function flushSync() {
  if (!cloud.client || !cloud.user || cloud.busy || !navigator.onLine) return;
  cloud.busy = true; cloud.error = null; refreshCloudCard();
  try {
    let q = getSyncQueue();
    while (q.length) {
      const item = q[0];
      if (item.op === "delete") {
        const { error } = await cloud.client.rpc("delete_session", { p_date: item.date, p_day_id: item.dayId });
        if (error) throw error;
      } else {
        const sess = getSessions().find(x => x.date === item.date && x.dayId === item.dayId);
        if (sess) {
          const { error } = await cloud.client.rpc("save_session", { payload: sessionToPayload(sess) });
          if (error) throw error;
        }
      }
      // rilegge la coda: nel frattempo potrebbero essere arrivate nuove modifiche
      q = getSyncQueue();
      if (q.length && q[0].date === item.date && q[0].dayId === item.dayId && q[0].op === item.op) q.shift();
      setSyncQueue(q);
    }
    lsSet(LS_SYNC_LAST, new Date().toISOString());
  } catch (e) {
    cloud.error = "Errore di sincronizzazione: " + (e.message || e);
  }
  cloud.busy = false;
  refreshCloudCard();
}

// Primo accesso / sync manuale: scarica le sessioni che mancano in locale e carica tutte quelle locali.
async function cloudFullSync() {
  if (!cloud.client || !cloud.user || cloud.busy) return;
  cloud.busy = true; cloud.error = null; refreshCloudCard();
  try {
    const { data, error } = await cloud.client.from("sessions")
      .select("date, day_id, deload, set_logs(exercise_key, set_number, leg, value, target)");
    if (error) throw error;
    const local = getSessions();
    const remoteKeys = new Set();
    let added = 0;
    (data || []).forEach(row => {
      remoteKeys.add(row.date + "::" + row.day_id);
      if (!local.some(s => s.date === row.date && s.dayId === row.day_id)) { local.push(remoteToSession(row)); added++; }
    });
    if (added) saveSessions(local);
    // le sessioni locali che il cloud non ha vanno caricate
    const q = getSyncQueue();
    local.forEach(s => {
      if (!remoteKeys.has(s.date + "::" + s.dayId) && !q.some(x => x.date === s.date && x.dayId === s.dayId)) q.push({ op: "save", date: s.date, dayId: s.dayId });
    });
    setSyncQueue(q);
    cloud.busy = false;
    if (added && state.tab !== "day") render();
    await flushSync();
    fetchReports();
  } catch (e) {
    cloud.busy = false;
    cloud.error = "Errore di sincronizzazione: " + (e.message || e);
    refreshCloudCard();
  }
}

// Markdown minimo: titoli, elenchi puntati/numerati, grassetto, codice, paragrafi.
function mdInline(s) {
  return escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function mdToHtml(md) {
  const lines = String(md || "").replace(/\r/g, "").split("\n");
  let html = "", list = null, para = [];
  const flushPara = () => { if (para.length) { html += `<p>${para.map(mdInline).join("<br>")}</p>`; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  lines.forEach((raw, i) => {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushPara(); closeList(); return; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
      flushPara(); closeList();
      if (m[1].length === 1 && i === 0) return; // il titolo è già nell'intestazione della card
      html += m[1].length <= 1 ? `<h3>${mdInline(m[2])}</h3>` : `<h4>${mdInline(m[2])}</h4>`;
      return;
    }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      flushPara();
      const kind = /^\s*\d/.test(line) ? "ol" : "ul";
      if (list !== kind) { closeList(); html += `<${kind}>`; list = kind; }
      html += `<li>${mdInline(m[1])}</li>`;
      return;
    }
    closeList();
    para.push(line.trim());
  });
  flushPara(); closeList();
  return html;
}

function renderReports() {
  const reports = getReports();
  let html = `${renderCloudCard()}<div class="section-label">Analisi settimanale${reports.length ? `<span class="count">${reports.length}</span>` : ""}</div>`;
  if (!reports.length) {
    html += `<div class="empty-state">Nessuna analisi ancora.<br>Ogni domenica sera arriva qui il riepilogo della settimana con i consigli per la successiva.${cloud.user ? "" : "<br>Accedi al cloud per riceverlo."}</div>`;
    return html;
  }
  reports.forEach((r, i) => {
    const open = state.reportOpen[r.week_start] ?? i === 0;
    const created = r.created_at ? new Date(r.created_at).toLocaleString("it-IT", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
    html += `<div class="report ${i === 0 ? "latest" : ""}">

      </div>
      ${open ? `<div class="rbody">${mdToHtml(r.content)}</div>` : ""}
    </div>`;
  });
  return html;
}

function renderCloudCard() {
  if (!cloudEnabled()) return "";
  const pending = getSyncQueue().length;
  let cls = "", title, sub, actions;

    <div class="cl-actions">${actions}</div>

}

async function checkForUpdate() {
  try {
    const res = await fetch("index.html?check=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const m = (await res.text()).match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION) document.getElementById("updateBar").classList.add("show");
  } catch (e) {}
}
document.getElementById("updateBtn").addEventListener("click", () => {
  autosaveIfToday();
  location.reload();
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
window.addEventListener("load", checkForUpdate);
setInterval(checkForUpdate, 5 * 60 * 1000);

</script>
